[watch]
watch = ["src", "index.html","package.json", "styling.scss"]

[[hooks]]
stage = "pre_build"
command = "npm"
command_arguments = ["install"]

[[hooks]]
stage = "pre_build"
command = "npx"
command_arguments = [ "esbuild","--minify", "--bundle", "src/typescript/lib.ts", "--outfile=tslibs.js"]

[[copy]]
src = "tslibs.js"
dest = "dist/"
